# 一键部署 compose(生产用)
# 用法: docker compose up -d --build
services:
  bank2excel:
    build: .
    image: bank2excel-server:latest
    container_name: bank2excel
    restart: unless-stopped
    ports:
      - "80:8000"          # 直接 http://VPS_IP 访问(无需备案, IP 访问免备案)
    environment:
      - TZ=Asia/Shanghai
      # 描述符缓存目录(挂卷持久化: 新格式识别一次, 之后零成本秒转)
      - DESCRIPTOR_CACHE_DIR=/data/descriptors
      # ---- 视觉兜底(可选): 三行都配上才启用, 未知格式自动走 VLM 识别 ----
      # - BANK_PDF_VISION_PROVIDER=api
      # - BANK_PDF_VISION_API_BASE=https://open.bigmodel.cn/api/paas/v4
      # - BANK_PDF_VISION_API_KEY=sk-xxxxxxxx
      # - BANK_PDF_VISION_API_MODEL=glm-4v-flash
      # ---- 成本/并发控制(可省略, 括号内为默认值) ----
      # - VLM_BUDGET_PER_HOUR=40      # 每小时视觉调用预算(超限自动降级纯规则)
      # - RATE_LIMIT_PER_MIN=12       # 每 IP 每分钟转换请求数
      # - MAX_CONCURRENT=2            # 同时转换数
    volumes:
      - ./descriptors:/data/descriptors
    mem_limit: 1g          # 防止极端大文件吃满内存
    # 可选: 上传上限调大(默认 uvicorn 无 body 限制, 引擎侧已限 200MB)
